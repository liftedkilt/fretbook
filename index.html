<!doctype html>
<!--
  Songsterr-style bass tab player: renders the tab (tab-data.js) and keeps the
  current measure highlighted in sync with a local audio file.
  The song comes from ?song=<slug> (data in songs/<slug>/, built by fetch_song.py).
  New songs are added from the page through server.py (POST /api/add); the library
  view (no ?song) lists them from GET /api/songs. Sync points are
  tapped by the user (T key), interpolated between taps, and saved in localStorage.
  Serve it over http (python3 -m http.server) so the audio file can be loaded.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Construção · Tab Sync</title>
<style>
  :root {
    --bg: #17171a; --panel: #202025; --card: #1e1e23; --line: #3a3a42;
    --text: #e8e8ec; --dim: #8a8a96; --accent: #ffb020; --accent2: #4cc2ff;
    --loop: rgba(76,194,255,.10); --active: rgba(255,176,32,.14);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
           padding: 10px 16px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  #playerBox { width: 360px; max-width: 100%; flex: none; }
  #au { width: 100%; }
  .ctl { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  input, select, button, textarea { background: #2b2b32; color: var(--text); border: 1px solid var(--line);
           border-radius: 5px; padding: 5px 9px; font: inherit; }
  input[type=text] { flex: 1; min-width: 200px; }
  input[type=number] { width: 70px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.pri { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
  #status { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
  .hint { color: var(--dim); font-size: 12px; }
  kbd { background: #2b2b32; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
  details { width: 100%; }
  textarea { width: 100%; height: 80px; font: 11px monospace; }

  #tab { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 14px 16px 60vh; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 1000px) { #tab { grid-template-columns: repeat(2, 1fr); } }
  .m { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 6px;
       height: var(--mh, 98px); cursor: pointer; scroll-margin-top: var(--hh, 260px); }
  .m:hover { border-color: #55555f; }
  .m.loop { background: var(--loop); }
  .m.active { background: var(--active); border-color: var(--accent); }
  .m.tapnext { outline: 2px dashed var(--accent2); outline-offset: 1px; }
  .num { position: absolute; top: 3px; left: 6px; font-size: 10px; color: var(--dim); }
  .m.anchor .num::after { content: " ●"; color: var(--accent2); }
  .staff { position: absolute; left: 18px; right: 6px; top: 22px; height: 54px; }
  .staff i { position: absolute; left: 0; right: 0; height: 1px; background: var(--line); }
  .sl { position: absolute; left: 6px; font-size: 9px; color: var(--dim); transform: translateY(-50%); }
  .n { position: absolute; transform: translate(-50%, -50%); background: var(--card); padding: 2px 5px;
       border-radius: 4px; font: 700 13px/1 ui-monospace, monospace; }
  .m.active .n { background: #2a2518; }
  .m.loop .n { background: #1b2530; }
  .m .n.next { outline: 1.5px dashed var(--accent2); outline-offset: 1px; }
  .m .n.now { background: var(--accent); color: #111; box-shadow: 0 0 10px rgba(255,176,32,.7); }
  #playctl { display: flex; flex-direction: column; gap: 8px; }
  body.library #playerBox, body.library #playctl { display: none; }
  .lib { grid-column: 1 / -1; }
  .lib input { width: 100%; margin-bottom: 12px; }
  .libgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
  .pick b { display: block; font-size: 15px; }
  .pick .meta { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .pick .bad { color: #ff9a7a; }
  .pick .ok { color: #7ad69a; }
  .pick:hover { border-color: var(--accent); }
  .pick { display: block; padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; color: var(--text); text-decoration: none; }
  .pick small { color: var(--dim); }
  .cursor { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--accent); pointer-events: none; z-index: 2; }
</style>
</head>
<body>
<header>
  <div id="playerBox"><audio id="au" controls preload="auto"></audio></div>
  <div class="ctl">
    <div class="row">
      <input type="text" id="newurl" placeholder="URL do Songsterr para carregar uma nova música">
      <button id="add" class="pri">Carregar nova música</button>
      <a href="?list" class="hint">Músicas</a>
    </div>
    <div class="hint" id="addst"></div>
    <div id="playctl">
    <div id="song" style="font-weight:600"></div>
    <div class="row">
      <label class="hint">Outro áudio: <input type="file" id="file" accept="audio/*,video/*"></label>
    </div>
    <div class="row">
      <span id="status">–</span>
      <label class="hint">Vel.
        <select id="rate"><option>0.5</option><option>0.75</option><option selected>1</option></select>
      </label>
      <label class="hint">BPM <input type="number" id="bpm" min="40" max="300" step="0.5"></label>
      <label class="hint"><input type="checkbox" id="follow" checked> seguir</label>
    </div>
    <div class="row">
      <button id="tap" class="pri">Marcar compasso [T]</button>
      <button id="nm">−0.05s</button><button id="np">+0.05s</button>
      <button id="rm">Remover marca</button>
      <button id="la">Loop A</button><button id="lb">Loop B</button><button id="lc">Limpar loop</button>
    </div>
    <div class="hint" id="err" style="color:#ff7a7a"></div>
    <div class="hint">
      Clique num compasso para pular e escolher onde marcar. Toque <kbd>T</kbd> no 1º tempo de cada compasso (basta marcar
      alguns pontos: o resto é interpolado). <kbd>Espaço</kbd> play/pause · <kbd>←</kbd><kbd>→</kbd> compasso anterior/próximo.
    </div>
    <details><summary class="hint">Exportar / importar marcas</summary>
      <textarea id="io" spellcheck="false"></textarea>
      <div class="row"><button id="exp">Exportar</button><button id="imp">Importar</button><button id="clr">Apagar todas as marcas</button><button id="pre">Restaurar sincronia padrão</button></div>
    </details>
    </div>
  </div>
</header>
<main id="tab"></main>

<script>
window.startPlayer = slug => {
  const KEY = "construcao-sync:" + TAB.songId;
  const N = TAB.measures.length;
  const $ = id => document.getElementById(id);
  try { const l = JSON.parse(localStorage.getItem("bts:last") || "{}"); l[slug] = Date.now(); localStorage.setItem("bts:last", JSON.stringify(l)); } catch (e) {}
  let st = { url: "", bpm: TAB.bpm, anchors: {}, loopA: null, loopB: null };
  try { Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

  let starts = [], tapIdx = 0, cur = -1, lastScrollRow = -1;

  // ---- render tab ----
  document.documentElement.style.setProperty("--mh", 44 + 18 * (TAB.strings.length - 1) + "px");
  const tab = $("tab"), cells = [], evs = [];
  TAB.measures.forEach(([len, events], i) => {
    const m = document.createElement("div");
    m.className = "m"; m.dataset.i = i;
    m.innerHTML = `<span class="num">${i + 1}</span><div class="staff"></div>`;
    const staff = m.firstChild.nextSibling;
    for (let s = 0; s < TAB.strings.length; s++) {
      const y = s * 18;
      staff.insertAdjacentHTML("beforeend", `<i style="top:${y}px"></i><span class="sl" style="top:${y}px">${TAB.strings[s]}</span>`);
    }
    for (const [pos, notes] of events) {
      const ev = { els: [], i, pos, len, t: 0 };
      evs.push(ev);
      for (const [s, fret] of notes) {
        const n = document.createElement("span");
        n.className = "n"; n.textContent = fret;
        n.style.top = s * 18 + "px";
        n.style.left = `calc(${(pos / len).toFixed(4)} * (100% - 14px) + 8px)`;
        staff.appendChild(n); ev.els.push(n);
      }
    }
    m.addEventListener("click", () => { tapIdx = i; seekTo(starts[i]); paintTap(); });
    tab.appendChild(m); cells.push(m);
  });
  const cursor = document.createElement("div"); cursor.className = "cursor";

  // ---- sync model: piecewise-linear over anchors, extrapolated at both ends ----
  function rebuild() { computeStarts(); evs.forEach(e => { e.t = starts[e.i] + e.pos / e.len * (starts[e.i + 1] - starts[e.i]); }); }
  function computeStarts() {
    const L = 240 / st.bpm;
    const a = Object.keys(st.anchors).map(Number).sort((x, y) => x - y);
    starts = new Array(N + 1);
    if (!a.length) { for (let i = 0; i <= N; i++) starts[i] = i * L; return; }
    const T = k => st.anchors[k];
    for (let i = 0; i <= N; i++) {
      if (i <= a[0]) starts[i] = T(a[0]) - (a[0] - i) * L;
      else if (i >= a[a.length - 1]) {
        const k = a[a.length - 1];
        const Ls = a.length > 1 ? (T(k) - T(a[a.length - 2])) / (k - a[a.length - 2]) : L;
        starts[i] = T(k) + (i - k) * Ls;
      } else {
        let j = 0; while (a[j + 1] <= i) j++;
        const f = (i - a[j]) / (a[j + 1] - a[j]);
        starts[i] = T(a[j]) + f * (T(a[j + 1]) - T(a[j]));
      }
    }
  }
  function measureAt(t) {
    if (t < starts[0]) return -1;
    let lo = 0, hi = N - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[mid] <= t) lo = mid; else hi = mid - 1; }
    return t >= starts[N] ? N : lo;
  }

  function paintMarks() {
    cells.forEach((c, i) => {
      c.classList.toggle("anchor", st.anchors[i] !== undefined);
      c.classList.toggle("loop", st.loopA !== null && st.loopB !== null && i >= st.loopA && i <= st.loopB);
    });
  }
  function paintTap() { cells.forEach((c, i) => c.classList.toggle("tapnext", i === tapIdx)); }

  // ---- player: <audio> element wrapped with the small API the rest of the code uses ----
  const au = $("au");
  au.src = `songs/${slug}/audio.mp3`;
  $("song").textContent = [TAB.artist, TAB.title].filter(Boolean).join(" – ");
  if (TAB.title) document.title = TAB.title + " · Tab Sync";
  au.preservesPitch = true;
  const player = {
    getCurrentTime: () => au.currentTime,
    seekTo: t => { au.currentTime = t; },
    getPlayerState: () => (au.paused ? 2 : 1),
    pauseVideo: () => au.pause(),
    playVideo: () => au.play(),
    setPlaybackRate: r => { au.playbackRate = r; },
  };
  const ready = true;
  const time = () => (ready ? player.getCurrentTime() : 0);
  const seekTo = t => { if (ready) player.seekTo(Math.max(0, t), true); };
  const fmt = t => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, "0")}`;

  // ---- note markers: filled box on the note just hit, dashed box on the upcoming one ----
  let nowEv = null, nextEv = null;
  function markNotes(t) {
    let lo = -1, hi = evs.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (evs[mid].t <= t) lo = mid; else hi = mid - 1; }
    const hit = lo >= 0 && t - evs[lo].t < 0.25 ? evs[lo] : null;
    const next = evs[lo + 1] || null;
    if (hit !== nowEv) { nowEv && nowEv.els.forEach(e => e.classList.remove("now")); hit && hit.els.forEach(e => e.classList.add("now")); nowEv = hit; }
    if (next !== nextEv) { nextEv && nextEv.els.forEach(e => e.classList.remove("next")); next && next.els.forEach(e => e.classList.add("next")); nextEv = next; }
  }

  // ---- per-frame update ----
  function frame() {
    if (ready) {
      const t = time(), i = measureAt(t);
      if (st.loopA !== null && st.loopB !== null && i > st.loopB && player.getPlayerState() === 1) seekTo(starts[st.loopA]);
      if (i !== cur) {
        if (cells[cur]) cells[cur].classList.remove("active");
        cur = i;
        const c = cells[cur];
        if (c && cur < N) {
          c.classList.add("active");
          const row = Math.floor(cur / (getComputedStyle(tab).gridTemplateColumns.split(" ").length));
          if ($("follow").checked && row !== lastScrollRow) {
            const r = c.getBoundingClientRect(), hh = document.querySelector("header").offsetHeight;
            if (r.top < hh || r.bottom > innerHeight - 30) c.scrollIntoView({ block: "start", behavior: "smooth" });
            lastScrollRow = row;
          }
        }
      }
      markNotes(t);
      if (cur >= 0 && cur < N) {
        const f = Math.min(1, Math.max(0, (t - starts[cur]) / (starts[cur + 1] - starts[cur])));
        const staff = cells[cur].lastChild;
        if (cursor.parentNode !== staff) staff.appendChild(cursor);
        cursor.style.left = `calc(${f.toFixed(4)} * (100% - 14px) + 8px)`;
      } else if (cursor.parentNode) cursor.remove();
      $("status").textContent = `${cur >= 0 && cur < N ? "Compasso " + (cur + 1) + "/" + N : "–"} · ${fmt(t)}`;
    }
    requestAnimationFrame(frame);
  }

  // ---- actions ----
  function setAnchor(i, t) { st.anchors[i] = t; rebuild(); paintMarks(); save(); }
  function tap() {
    if (!ready) return;
    setAnchor(tapIdx, time());
    tapIdx = Math.min(N - 1, tapIdx + 1); paintTap();
  }
  function nudge(d) {
    if (cur < 0 || cur >= N) return;
    setAnchor(cur, starts[cur] + d); seekTo(time());
  }
  const step = d => { const i = Math.min(N - 1, Math.max(0, (cur < 0 ? 0 : cur) + d)); tapIdx = i; seekTo(starts[i]); paintTap(); };

  $("file").onchange = e => {
    const f = e.target.files[0];
    if (f) { au.src = URL.createObjectURL(f); $("err").textContent = "Áudio carregado: " + f.name; }
  };
  au.onerror = () => { $("err").textContent = `Não consegui carregar songs/${slug}/audio.mp3. Coloque um mp3 nessa pasta ou use "Outro áudio".`; };
  $("tap").onclick = tap;
  $("nm").onclick = () => nudge(-0.05);
  $("np").onclick = () => nudge(0.05);
  $("rm").onclick = () => { if (cur >= 0) { delete st.anchors[cur]; rebuild(); paintMarks(); save(); } };
  $("la").onclick = () => { if (cur >= 0) { st.loopA = cur; if (st.loopB === null || st.loopB < cur) st.loopB = cur; paintMarks(); save(); } };
  $("lb").onclick = () => { if (cur >= 0) { st.loopB = cur; if (st.loopA === null || st.loopA > cur) st.loopA = cur; paintMarks(); save(); } };
  $("lc").onclick = () => { st.loopA = st.loopB = null; paintMarks(); save(); };
  $("rate").onchange = () => player.setPlaybackRate(+$("rate").value);
  $("bpm").onchange = () => { st.bpm = +$("bpm").value || TAB.bpm; rebuild(); save(); };
  $("exp").onclick = () => { $("io").value = JSON.stringify({ bpm: st.bpm, anchors: st.anchors }); };
  $("imp").onclick = () => {
    try { const d = JSON.parse($("io").value); st.bpm = d.bpm || st.bpm; st.anchors = d.anchors || {}; $("bpm").value = st.bpm; rebuild(); paintMarks(); save(); }
    catch (e) { $("io").value = "JSON inválido"; }
  };
  $("pre").onclick = applyPreset;
  $("clr").onclick = () => { st.anchors = {}; rebuild(); paintMarks(); save(); };

  document.addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.ctrlKey || e.metaKey) return;
    if (e.key === "t" || e.key === "T") tap();
    else if (e.key === " " && ready) { e.preventDefault(); player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  });

  const setHH = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + 8 + "px");
  addEventListener("resize", setHH);

  function applyPreset() {
    st.anchors = {}; PRESET.points.forEach((t, i) => { if (i < N) st.anchors[i] = t; });
    rebuild(); paintMarks(); save();
  }
  if (!Object.keys(st.anchors).length) applyPreset();
  $("bpm").value = st.bpm;
  rebuild(); paintMarks(); paintTap(); setHH();
  requestAnimationFrame(frame);
};
</script>
<script>
// Loader: reads ?song=<slug>, loads that song's data scripts, then starts the player
(() => {
  const slug = new URLSearchParams(location.search).get("song");
  const load = src => new Promise((ok, bad) => {
    const el = document.createElement("script");
    el.src = src; el.onload = ok; el.onerror = () => bad(src); document.head.appendChild(el);
  });
  const show = text => { document.getElementById("tab").textContent = text; };
  const fmtDur = t => `${Math.floor(t / 60)}:${String(Math.round(t % 60)).padStart(2, "0")}`;
  async function listSongs() {
    document.body.classList.add("library");
    let songs;
    try { songs = await (await fetch("/api/songs")).json(); }
    catch (e) { show("Biblioteca indisponível. Inicie o servidor com: python3 server.py"); return; }
    let last = {};
    try { last = JSON.parse(localStorage.getItem("bts:last") || "{}"); } catch (e) {}
    songs.sort((x, y) => (last[y.slug] || 0) - (last[x.slug] || 0) || (x.artist + x.title).localeCompare(y.artist + y.title));
    const box = document.getElementById("tab");
    box.textContent = "";
    const lib = document.createElement("div"); lib.className = "lib";
    const search = document.createElement("input");
    search.type = "text"; search.placeholder = `Buscar entre ${songs.length} música(s)`;
    const grid = document.createElement("div"); grid.className = "libgrid";
    const cards = songs.map(x => {
      const a = document.createElement("a");
      a.className = "pick"; a.href = "?song=" + encodeURIComponent(x.slug);
      const b = document.createElement("b"); b.textContent = x.title;
      const who = document.createElement("div"); who.textContent = x.artist;
      const meta = document.createElement("div"); meta.className = "meta";
      const info = [x.instrument, x.measures + " compassos", x.duration ? fmtDur(x.duration) : null, x.bpm ? x.bpm + " bpm" : null].filter(Boolean).join(" · ");
      meta.append(info, document.createElement("br"));
      for (const [ok, yes, no] of [[x.hasSync, "sync ✓", "sem sync"], [x.hasAudio, "áudio ✓", "sem áudio"]]) {
        const t = document.createElement("span"); t.className = ok ? "ok" : "bad"; t.textContent = (ok ? yes : no) + "  ";
        meta.appendChild(t);
      }
      if (last[x.slug]) meta.append("· aberta em " + new Date(last[x.slug]).toLocaleDateString("pt-BR"));
      a.append(b, who, meta); a.dataset.q = (x.title + " " + x.artist).toLowerCase();
      grid.appendChild(a); return a;
    });
    search.oninput = () => cards.forEach(c => { c.style.display = c.dataset.q.includes(search.value.toLowerCase()) ? "" : "none"; });
    lib.append(search, grid); box.appendChild(lib);
    if (!songs.length) show("Nenhuma música ainda. Cole uma URL do Songsterr acima.");
  }
  const $ = id => document.getElementById(id);
  async function addSong() {
    const url = $("newurl").value.trim(), out = $("addst");
    if (!url) return;
    const say = (t, err) => { out.textContent = t; out.style.color = err ? "#ff7a7a" : ""; };
    $("add").disabled = true; say("Iniciando");
    try {
      const r = await fetch("/api/add", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
      if (r.status === 404 || r.status === 501) throw new Error("no-server");
      if (!(r.headers.get("Content-Type") || "").includes("ndjson")) { say((await r.json()).error || "Erro", true); return; }
      const rd = r.body.getReader(), dec = new TextDecoder();
      let buf = "", slug = null;
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const ln of lines.filter(Boolean)) {
          const m = JSON.parse(ln);
          if (m.status) say(m.status + (m.status.includes("%") || m.status === "Pronto" ? "" : "…"));
          if (m.error) say("Erro: " + m.error, true);
          if (m.done) slug = m.done;
        }
      }
      if (slug) { say("Pronto! Abrindo…"); setTimeout(() => { location.href = "?song=" + encodeURIComponent(slug); }, 500); }
    } catch (e) {
      say(e.message === "no-server" ? "Servidor de download não está rodando. Inicie com: python3 server.py" : "Falha: " + e.message, true);
    } finally { $("add").disabled = false; }
  }
  $("add").onclick = addSong;
  $("newurl").addEventListener("keydown", e => { if (e.key === "Enter") addSong(); });
  if (!slug) { listSongs(); return; }
  Promise.all([load(`songs/${slug}/tab-data.js`), load(`songs/${slug}/sync-preset.js`)])
    .then(() => window.startPlayer(slug))
    .catch(src => show("Não achei " + src));
})();
</script>
