services:
  fretbook:
    build: .
    image: fretbook
    ports:
      - "8137:8137"
    volumes:
      - fretbook-data:/data
      - ./songs:/songs:ro
    environment:
      FRETBOOK_HOST: "0.0.0.0"
      # Without FRETBOOK_OIDC_ISSUER there is no login: anyone who can reach
      # this port can use the library. Publish it only where that is fine.
      # To sign in with Pocket ID (see the README):
      # FRETBOOK_OIDC_ISSUER: "https://id.example.com"
      # FRETBOOK_OIDC_CLIENT_ID: "..."
      # FRETBOOK_OIDC_REDIRECT_URI: "https://fretbook.example.com/auth/callback"
      # FRETBOOK_SESSION_SECRET: "..."   # openssl rand -hex 32
      # Behind a reverse proxy, set the proxy's address so it may send
      # X-Forwarded-* headers (the default trusts only 127.0.0.1):
      # FRETBOOK_FORWARDED_ALLOW_IPS: "172.18.0.1"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8137/api/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  fretbook-data:
