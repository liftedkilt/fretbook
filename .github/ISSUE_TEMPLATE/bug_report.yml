name: Bug report
description: Report something in Fretbook that is not working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you doing, how can it be reproduced, and what happened (logs, screenshots, song or import format)?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Concrete checks and regression tests that show the bug is fixed.
      placeholder: |
        - [ ] Regression test added
        - [ ] All checks in CONTRIBUTING.md pass
    validations:
      required: true

  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Optional issues that must close before this one can start (also add the `blocked` label). Keep the `**Blocked by:**` prefix so `.github/workflows/unblock.yml` can unblock it automatically.
      placeholder: "**Blocked by:** #123"
    validations:
      required: false
