name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A new push to a pull request cancels the run it supersedes. Pushes to
# branches (including main) always run to completion.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check fretbook tests
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types are current
        run: npm run api-types:check
      - run: npm run check
      - run: npm test
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Committed OpenAPI contract is current
        run: python -m fretbook.openapi --check

  repo-checks:
    # Cheap guards for files that parallel pull requests collide on.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Migration numbers are unique and have no gaps
        run: python3 scripts/check_migrations.py
      - name: Locale files are valid and consistently formatted
        run: python3 scripts/check_locales.py

  pr-title:
    # Release notes are built from squash-merged PR titles. Passes on pushes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py

  ui-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ui-only label stays inside web/
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/check_ui_only.sh

  e2e:
    # Playwright drives Chromium against a real `python -m fretbook` serving the built web app.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install Chromium and its system libraries
        working-directory: web
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Chromium's system libraries (browser came from the cache)
        working-directory: web
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Type-check the e2e project
        working-directory: web
        run: npm run check:e2e
      - name: Build the web app and run the e2e suite
        working-directory: web
        run: npm run e2e
      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7

  ci-ok:
    # The single check to require in branch protection. Add every new job to
    # `needs` so the required check keeps covering it without editing the
    # branch-protection settings.
    if: always()
    needs: [backend, frontend, openapi, repo-checks, pr-title, ui-only, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result != "success")' > /dev/null; then
            echo "::error::At least one required job did not succeed (failed, cancelled or skipped)."
            exit 1
          fi
