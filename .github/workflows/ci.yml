name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# One self-hosted runner. Cancel the run a newer push to the same ref
# supersedes, so stale work does not sit in the queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    # Reads the pull request title only, so it stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_pr_title.py

  dagger:
    # Never run fork pull request code on the privileged self-hosted runner.
    if: "github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository"
    runs-on: [self-hosted, dagger]
    permissions:
      contents: read
      actions: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dagger CLI
        run: dagger version
      - name: Run the checks
        env:
          OTEL_RESOURCE_ATTRIBUTES: github.repository=${{ github.repository }},github.ref=${{ github.ref_name }},github.sha=${{ github.sha }},github.run_id=${{ github.run_id }},github.actor=${{ github.actor }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          args=(--repository "$REPOSITORY" --run-id "$RUN_ID")
          if [ -n "${LABELS}" ]; then args+=(--labels "$LABELS"); fi
          if [ -n "${BASE_SHA}" ]; then args+=(--base-sha "$BASE_SHA"); fi
          if [ -n "${HEAD_SHA}" ]; then args+=(--head-sha "$HEAD_SHA"); fi
          if [ -n "${HEAD_REPOSITORY}" ]; then args+=(--head-repository "$HEAD_REPOSITORY"); fi
          dagger call --progress=plain ci "${args[@]}" | tee "${RUNNER_TEMP}/ci-summary.md"
      - name: Coverage summary
        if: success()
        run: |
          if [ -f "${RUNNER_TEMP}/ci-summary.md" ]; then
            cat "${RUNNER_TEMP}/ci-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export reports
        if: always()
        env:
          OTEL_RESOURCE_ATTRIBUTES: github.repository=${{ github.repository }},github.ref=${{ github.ref_name }},github.sha=${{ github.sha }},github.run_id=${{ github.run_id }},github.actor=${{ github.actor }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf ci-out
          dagger call --progress=plain reports --run-id "$RUN_ID" export --path=ci-out
      - name: Upload the server coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: ci-out/htmlcov/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: ci-out/web-coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: ci-out/playwright/
          if-no-files-found: ignore
          retention-days: 7

  dagger-fork:
    # Same functions, on a GitHub-hosted runner, for pull requests from forks.
    if: "github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the Dagger CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.11 BIN_DIR="$HOME/.local/bin" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/dagger" version
      - name: Run the checks
        env:
          OTEL_RESOURCE_ATTRIBUTES: github.repository=${{ github.repository }},github.ref=${{ github.ref_name }},github.sha=${{ github.sha }},github.run_id=${{ github.run_id }},github.actor=${{ github.actor }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          args=(--repository "$REPOSITORY" --run-id "$RUN_ID")
          if [ -n "${LABELS}" ]; then args+=(--labels "$LABELS"); fi
          if [ -n "${BASE_SHA}" ]; then args+=(--base-sha "$BASE_SHA"); fi
          if [ -n "${HEAD_SHA}" ]; then args+=(--head-sha "$HEAD_SHA"); fi
          if [ -n "${HEAD_REPOSITORY}" ]; then args+=(--head-repository "$HEAD_REPOSITORY"); fi
          dagger call --progress=plain ci "${args[@]}" | tee "${RUNNER_TEMP}/ci-summary.md"
      - name: Coverage summary
        if: success()
        run: |
          if [ -f "${RUNNER_TEMP}/ci-summary.md" ]; then
            cat "${RUNNER_TEMP}/ci-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export reports
        if: always()
        env:
          OTEL_RESOURCE_ATTRIBUTES: github.repository=${{ github.repository }},github.ref=${{ github.ref_name }},github.sha=${{ github.sha }},github.run_id=${{ github.run_id }},github.actor=${{ github.actor }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          rm -rf ci-out
          dagger call --progress=plain reports --run-id "$RUN_ID" export --path=ci-out
      - name: Upload the server coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: ci-out/htmlcov/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: ci-out/web-coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload traces and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: ci-out/playwright/
          if-no-files-found: ignore
          retention-days: 7

  ci-ok:
    # The single check to require in branch protection. A skipped Dagger job
    # is success only when it is the unused fork or same-repo path and the
    # other one succeeded. Any failure, cancellation, or skipped check fails.
    if: always()
    needs: [pr-title, dagger, dagger-fork]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_ok.py
