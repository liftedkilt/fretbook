name: Release

# release-please reads the Conventional Commit titles merged to main and keeps
# one release PR open. Merging it bumps the version files, writes CHANGELOG.md,
# creates the GitHub release and pushes the vX.Y.Z tag; the Docker workflow then
# publishes the image for that tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional. Pushes and PRs made with the default GITHUB_TOKEN do not start
      # other workflows, so without a token here the release PR gets no CI run.
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed with GITHUB_TOKEN does not trigger docker.yml, so start it by hand.
      # With RELEASE_PLEASE_TOKEN the tag push triggers it already.
      - name: Publish the image for the new tag
        if: steps.release.outputs.release_created == 'true' && env.HAS_RELEASE_TOKEN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
