[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fretbook"
version = "0.1.4"
description = "Self-hosted tabs and sheet music for bass and guitar."
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
dynamic = ["dependencies"]

[project.scripts]
fretbook-cli = "fretbook.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
# Only the server package: `web`, `songs`, `scripts`, `tests` and `docs` are not Python packages.
include = ["fretbook*"]

[tool.setuptools.package-data]
# Migrations, demo song, built-in lessons, and the build outputs the Docker image copies in
# (`fretbook/static` from the web build, `fretbook/gp/gp-to-document.mjs` from `npm run build:gp-cli`).
fretbook = [
    "audio/models/*",
    "db/migrations/*.sql",
    "demo/*",
    "lessons/builtin/**/*.md",
    "static/**/*",
    "gp/*.mjs",
]

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.10,<5",
    "pytesseract>=0.3.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
# An unclosed SQLite connection is a bug (every store method uses db.connection.session).
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.mypy]
python_version = "3.12"
files = ["fretbook"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Optional dependencies (requirements-vision.txt, requirements-stems.txt, requirements-transcribe.txt) and mido ship without type stubs.
module = ["cv2.*", "pytesseract.*", "PIL.*", "mido.*", "torch.*", "demucs.*", "onnxruntime.*", "scipy.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["fretbook", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["fretbook"]

[tool.coverage.run]
source = ["fretbook"]
branch = true

[tool.coverage.report]
# The floor: current total (lines and branches, 90.1%) rounded down. Raise it as tests are added; never lower it.
fail_under = 90
show_missing = true
skip_covered = true
