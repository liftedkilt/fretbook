[project]
name = "fretbook"
version = "0.1.0"
description = "Self-hosted tabs and sheet music for bass and guitar."
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
vision = [
    "opencv-python-headless>=4.10,<5",
    "pytesseract>=0.3.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
# An unclosed SQLite connection is a bug (every store method uses db.connection.session).
filterwarnings = [
    "error::ResourceWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["fretbook", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["fretbook"]
